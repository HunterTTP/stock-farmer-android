name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (YYYY.M.D-ga-N)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate tag and compute version code
        id: version
        run: echo "code=$(node tools/release.mjs version-code "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        run: node --test tools/*.test.mjs

      - name: Gate
        run: ./gradlew spotlessCheck :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Decode upload keystore
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}

      - name: Build signed bundle
        run: ./gradlew :app:bundleRelease -PversionCode=${{ steps.version.outputs.code }}
        env:
          STOCKFARMER_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          STOCKFARMER_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          STOCKFARMER_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          STOCKFARMER_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Write release notes
        run: |
          mkdir -p whatsnew
          node tools/release.mjs notes "$TAG" whatsnew/whatsnew-en-US

      - name: Read version name
        id: name
        run: echo "value=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hunter.stockfarmer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ steps.name.outputs.value }} (${{ env.TAG }})
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: whatsnew

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
